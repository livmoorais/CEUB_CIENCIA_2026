<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escola Virtual</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body{
font-family: Arial, Helvetica, sans-serif;
font-size: 16px;
background-color: #eef1f5;
color: #333333;
min-height: 100vh;
}

h1{
background-color: #1a2f44;
color: #fff;
text-align: center;
padding: 30px 20px;
font-size: 32px;
letter-spacing: 3px;
}
h2 {
text-align: center;
color: rgb(102, 102, 102);
margin: 40px 0 30px;
letter-spacing: 1px;
}
form {
width: 90%;
max-width: 960px;
margin: 0 auto 60px auto;
background-color: #fff;
padding: 50px 60px;
border-radius: 10px;
box-shadow: 4px 20px rgba(0, 0, 0, 0.8);
}

fieldset{
border: 2px solid #1a2f45;
border-radius: 8px;
padding: 30px 35px;
margin-bottom: 35px;
}

legend {
background-color: #1a2f45;
color: #fff;
padding: 7px 18px;
border-radius: 5px;
font-size: 15px;
letter-spacing: 1px;
}
.campo-grupo{
display: flex;
gap: 20px;
margin-bottom: 0;
}
.campo{
display: flex;
flex-direction: column;
margin-bottom: 20px;
flex: 1;
}
label{
display: inline-block;
margin-bottom: 8px;
font-weight: bold;
color: #1a2f45;
font-size: 14px;
text-transform: uppercase;
letter-spacing: 0.5px;
}
input[type= 'text'],
input[type='email'],
input[type='date']{
padding: 10px 14px;
border:1px solid #ccc;
border-radius: 5px;
font-size: 15px;
background-color: #fafafa;
transition: border-color 0.3s, box-shadow 0.3s;
width: 100%;
}

input[type='text']:focus,
input[type='email']:focus,
input[type='date']:focus{
border-color: #1a2f45;
box-shadow: 0 0 0 3px rgba(26,47,69,0.1);
outline: none;
background-color: #fff;
}
select{
padding: 10px 14px;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 15px;
background-color: #fafafa;
cursor: pointer;
width: 100%;
transition: border-color 0.3s;
}
select:focus{
border: #1a2f45;
outline: none;
}
table{
width: 100%;
border-collapse: separate;
border-spacing: 0;
}
td{
padding: 15px 20px;
vertical-align: top;
border-right: 1px solid #e0e0e0;
}
td:last-child{
border-right: none;
}

td > b, td > strong{
display: block;
font-size: 14px;
text-transform: uppercase;
letter-spacing: 0.5px;
color: #1a2f45;
margin-bottom: 12px;
}

input[type='radio'],
input[type='checkbox']{
margin-right: 8px;
cursor: pointer;
accent-color: #1a2f45;
width: 15px;
height: 15px;
}

td label{
text-transform: none;
letter-spacing: 0;
font-weight: normal;
font-size: 15px;
display: inline;
margin-bottom: 0;
}

.botoes{
text-align: center;
}
.botoes input{
padding: 12px 28px;
border-radius: 6px;
border: none;
font-size: 15px;
cursor: pointer;
margin: 0 8px;
}
.botoes input[type='submit']{
background-color: #1a2f45;
color: #fff;
}
.botoes input[type='reset']{
background-color: #e0e0e0;
color: #333;
}

#campo_segunda_lingua{
display: none;
margin-top: 16px;
}
#campo_segunda_lingua.visivel{
display: block;
}

</style>
</head>
<body>

<h1>Escola Virtual</h1>
<h2>Formulário de Pré-Matrícula</h2>

<form action="" method="post">

<fieldset>
<legend><strong>Dados Pessoais</strong></legend>

<div class="campo-grupo">
<div class="campo">
<label for="nome_aluno">Nome do Aluno</label>
<input type="text" id="nome_aluno" name="nome_aluno" required>
</div>
<div class="campo">
<label for="email">E-Mail</label>
<input type="email" id="email" name="email">
</div>
</div>

<div class="campo-grupo">
<div class="campo">
<label for="nome_mae">Nome da Mãe</label>
<input type="text" id="nome_mae" name="nome_mae">
</div>
<div class="campo">
<label for="nome_pai">Nome do Pai</label>
<input type="text" id="nome_pai" name="nome_pai">
</div>
</div>


<div class="campo-grupo">
<div class="campo">
<label for="nascimento">Nascimento</label>
<input type="date" id="nascimento" name="nascimento">
</div>
<div class="campo">
<label for="telefone">Telefone</label>
<input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
</div>
</div>

<div class="campo-grupo">
  <div class="campo">
  <label for="cep">CEP</label>
  <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
  </div>
  </div>
  
  <div class="campo-grupo">
    <div class="campo">
    <label for="cpf">CPF</label>
    <input type="text" id="cpf" name="cpf" maxlength="9" placeholder="00000-000">
    </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
      <label for="matricula">matricula</label>
      <input type="text" id="matricula" name="matricula" maxlength="9" placeholder="000.000.000-00">
      </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
        <label for="idade">idade</label>
        <input type="text" id="idade" name="idade" maxlength="9" placeholder="dd/mm/yyyy">
        </div>
        </div>

</fieldset>

<fieldset>
<legend><strong>Endereço</strong></legend>


<div class="campo-grupo">
<div class="campo">
<label for="logradouro">Logradouro</label>
<input type ="text" name ="logradouro" disabled>
</div>
<div class="campo">
<label for="numero">Número</label>
<input type="text" id="numero" name="numero" placeholder="Ex: 123">
</div>
</div>

<div class="campo-grupo">
<div class="campo">
<label for="complemento">Complemento</label>
<input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco...">
</div>
<div class="campo">
<label for="bairro">Bairro</label>
<input type ="text" name ="logradouro" disabled>
</div>
</div>

<div class="campo-grupo">
<div class="campo">
<label for="cidade">Cidade</label>
<input type ="text" name ="logradouro" disabled>
</div>
<div class="campo">
<label for="estado">Estado</label>
<input type ="text" name ="logradouro" disabled>
</div>
<div class="campo">
<label for="ibge">Código IBGE</label>
<input type ="text" name ="logradouro" disabled>
</div>
</div>

</fieldset>

<fieldset>
<legend><strong>Informações de Matrícula</strong></legend>

<table>
<tr valign="top">
<td>
<strong>Série</strong>
<select id="serie" name="serie">
<option value="pre-escolar">Pré-escolar</option>
<option value="1ano">1º ano</option>
<option value="2ano">2º ano</option>
<option value="3ano">3º ano</option>
<option value="4ano">4º ano</option>
<option value="5ano">5º ano</option>
</select>

<div id="campo_segunda_lingua">
<label for="segunda_lingua">Segunda Língua</label>
<select id="segunda_lingua" name="segunda_lingua">
<option value="ingles">Inglês</option>
<option value="espanhol">Espanhol</option>
</select>
</div>
</td>

<td>
<strong>Turno</strong>
<input type="radio" name="turno" id="manha" value="manha">
<label for="manha">Manhã</label><br>
<input type="radio" name="turno" id="tarde" value="tarde">
<label for="tarde">Tarde</label>
</td>

<td>
<strong>Atividades Extracurriculares</strong>
<input type="checkbox" name="atividades" id="informatica" value="informatica">
<label for="informatica">Informática</label><br>

<input type="checkbox" name="atividades" id="musica" value="musica">
<label for="musica">Música</label><br>

<input type="checkbox" name="atividades" id="balet" value="balet">
<label for="balet">Balet</label><br>

<input type="checkbox" name="atividades" id="pintura" value="pintura">
<label for="pintura">Pintura</label><br>

<input type="checkbox" name="atividades" id="judo" value="judo">
<label for="judo">Judô</label><br>

<input type="checkbox" name="atividades" id="futebol" value="futebol">
<label for="futebol">Futebol</label>
</td>
</tr>
</table>
</fieldset>

<div class="botoes">
<input type="submit" value="Enviar Formulário">
<input type="reset" value="Limpar Campos">
</div>

</form>

<script>
const serieSelect = document.getElementById('serie');
const campoSegundaLingua = document.getElementById('campo_segunda_lingua');

function atualizarSegundaLingua() {
if (serieSelect.value === '5ano') {
campoSegundaLingua.classList.add('visivel');
} else {
campoSegundaLingua.classList.remove('visivel');
}
}

serieSelect.addEventListener('change', atualizarSegundaLingua);
atualizarSegundaLingua();

const campoCep = document.getElementById('cep');
campoCep.addEventListener('input', function(){
let valor = this.value.replace(/\D/g, '');
if(valor.length > 5){
valor = valor.slice(0,5) + '-' + valor.slice(5,8);
}
this.value = valor;
});

document.getElementById('nascimento').addEventListener('change', function({
  const nascimento = new Date(this.value);
  const hoje = new Date()

  let anos = hoje.getFullYear - nascimento.getFullYear

  document.getElementById('idade').value(anos='Anos')
}));

campoCep.addEventListener('blur' function(){
  const cepLimpo = this.value.replace(/\D/g,'')

  if(ceplimpo.length !== 8){
    alert('cep digitado esta errado');
    return;
  }

  fetch('https://viacep.com.br/ws/$(cepLimpo)/json')
  .then(r =>{
    if (!r.ok) throw new Error ('Erro na rede dos correrios');
    return r.json();
  })
  .then(dados =>{
    if(dados.erro){
      alert('cep não encontrado');
      return;
    }

    console.log(dados); 
    document.getElementById('logradouro'). value = dados.logradouro || '';
    document.getElementById('bairro'). value = dados.bairro || '';
    document.getElementById('cidade'). value = dados.localidade || '';
    document.getElementById('estado'). value = dados.uf || '';
    document.getElementById('ibge'). value = dados.ibge || '';


  })


})
</script>

</body>
</html>
